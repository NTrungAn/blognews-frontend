server {
    listen 80;
    server_name localhost;

    # Thư mục gốc chứa mã nguồn frontend tĩnh được build
    root /usr/share/nginx/html;
    index index.html;

    # Cấu hình nén Gzip để tăng tốc tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Phục vụ các file tĩnh với cache dài hạn
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Xử lý định tuyến SPA (React Router)
    # Nếu không tìm thấy file tĩnh trùng khớp, trỏ ngược về index.html để React xử lý routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Trang lỗi mặc định
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
